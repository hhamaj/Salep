[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "salep"
version = "0.1.0"
description = "Çocuklar için Türkçe sözdizimli, Python'a çevrilen programlama dili"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
salep = "salep.cli:main"

[tool.setuptools]
packages = ["salep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
